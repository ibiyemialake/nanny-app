# Adds HTTPS on top of compose.yaml. Turn it on by adding this line to .env:
#   COMPOSE_FILE=compose.yaml:compose.https.yaml
# and filling in SITE_DOMAIN and the Route 53 settings (see .env.example).
services:
  caddy:
    build:
      context: deploy
      dockerfile: caddy.Dockerfile
    image: nanny-app-caddy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.route53:/etc/caddy/Caddyfile:ro
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env}
      AWS_REGION: ${AWS_REGION:-us-east-1}
